version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cdss_db
    environment:
      POSTGRES_USER: cdss_user
      POSTGRES_PASSWORD: cdss_password
      POSTGRES_DB: cdss_hospital_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdss_user -d cdss_hospital_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: cdss_cache
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: python:3.12-slim
    container_name: cdss_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow
    entrypoint: >
      sh -c "pip install mlflow && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cdss_backend
    environment:
      - DATABASE_URL=postgresql://cdss_user:cdss_password@db:5432/cdss_hospital_db
      - REDIS_URL=redis://cache:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - SECRET_KEY=clinical-decision-support-super-secret-key-123456
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cdss_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
